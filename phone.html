<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Phone preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#e9e9e9;color:#333;padding:20px 16px 40px;text-align:center}
h1{font-size:18px;margin-bottom:4px}
p{font-size:14px;color:#666;margin-bottom:16px}
a{color:#d32300;font-weight:bold}
.phone{display:inline-block;width:414px;height:868px;background:#111;border-radius:40px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.phone iframe{width:390px;height:844px;border:0;border-radius:30px;background:#fff}
@media (max-width:460px){.phone{width:100%;height:auto;padding:0;background:none;box-shadow:none;border-radius:0}.phone iframe{width:100%;height:80vh;border-radius:0}}
</style></head><body>
<h1 id="t">Phone preview</h1>
<p>Scroll inside the phone. <a href="index.html">All three</a> &middot; <a id="full" href="index.html">Open full size</a></p>
<div class="phone"><iframe id="f" src="about:blank"></iframe></div>
<script>
var m = (new URLSearchParams(location.search).get('m') || 'A-conservative').replace(/[^A-Za-z-]/g,'');
document.getElementById('f').src = 'mockup-' + m + '.html';
document.getElementById('full').href = 'mockup-' + m + '.html';
document.getElementById('t').textContent = 'Phone preview: mock-up ' + m.split('-')[0];
</script>
</body></html>
